[project]
name = "tr2en"
version = "0.1.2"
readme = "README.md"
description = "Local Turkish to English translation for Windows: select text, press a hotkey. Gemini, any OpenAI-compatible API, or an offline model. Yerel Türkçe → İngilizce çeviri."
license = "MIT"
keywords = ["turkish", "turkce", "ceviri", "translation", "turkish-english", "offline-translation", "local", "windows", "gemini", "ollama"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: Turkish",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/PolatOzaslan21/tr2en"
Issues = "https://github.com/PolatOzaslan21/tr2en/issues"
Releases = "https://github.com/PolatOzaslan21/tr2en/releases"
Model = "https://huggingface.co/PolatOz/tr2en-model"

[project.optional-dependencies]
yerel = ["ctranslate2>=4", "sentencepiece>=0.2"]
test = ["pytest>=8"]
uygulama = ["pynput>=1.7", "pywin32>=306; sys_platform == 'win32'", "winotify>=1.1; sys_platform == 'win32'", "pystray>=0.19", "pillow>=10"]

[project.scripts]
tr2en-cli = "ceviri_katmani.cli:main"
tr2en-konsol = "ceviri_katmani.uygulama.ana:main"

[project.gui-scripts]
tr2en = "ceviri_katmani.uygulama.arkaplan:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ceviri_katmani"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tr2en"
version = "0.1.0"
readme = "README.md"
description = "Yerel Türkçe → İngilizce çeviri katmanı: metni seç, kısayola bas. Local Turkish to English translator for Windows (offline model + optional Gemini)."
license = "MIT"
keywords = ["turkish", "turkce", "ceviri", "translation", "turkish-english", "offline-translation", "local", "windows"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
yerel = ["ctranslate2>=4", "sentencepiece>=0.2"]
test = ["pytest>=8"]
uygulama = ["pynput>=1.7", "pywin32>=306; sys_platform == 'win32'", "winotify>=1.1; sys_platform == 'win32'", "pystray>=0.19", "pillow>=10"]

[project.scripts]
tr2en-cli = "ceviri_katmani.cli:main"
tr2en-konsol = "ceviri_katmani.uygulama.ana:main"

[project.gui-scripts]
tr2en = "ceviri_katmani.uygulama.arkaplan:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ceviri_katmani"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

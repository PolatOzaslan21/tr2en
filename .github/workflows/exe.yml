name: exe

# v* etiketi push edilince: test + tr2en.exe derle + sürüme (release) zip olarak ekle.
# Elle çalıştırma (Actions → exe → Run workflow): yalnızca derler ve indirilebilir
# "artifact" bırakır; sürüme dokunmaz (yayından önce elle denemek için).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Testler
        run: uv run --extra test --extra yerel --extra uygulama pytest -q
      - name: Sürüm adı
        shell: pwsh
        run: |
          $ad = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          "SURUM=$ad" >> $env:GITHUB_ENV
      - name: Derle
        shell: pwsh
        run: ./paketleme/derle.ps1 -Cikti dist -Surum $env:SURUM
      - uses: actions/upload-artifact@v7
        with:
          name: tr2en-${{ env.SURUM }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Sürüme ekle
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:SURUM *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:SURUM --generate-notes --latest --title "tr2en $env:SURUM" }
          gh release upload $env:SURUM (Get-ChildItem dist/*.zip, dist/*.sha256).FullName --clobber

name: exe

# v* etiketi push edilince: test + tr2en.exe derle + sürüme (release) kurulum dosyası ve zip olarak ekle.
# Sürüme eklendikten sonra kurulum dosyası ve zip VirusTotal'da taranır; sonuç sürüm notunun sonuna yazılır.
# Elle çalıştırma (Actions → exe → Run workflow): yalnızca derler ve indirilebilir
# "artifact" bırakır; sürüme dokunmaz (yayından önce elle denemek için).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Testler
        run: uv run --extra test --extra yerel --extra uygulama pytest -q
      - name: Sürüm adı
        shell: pwsh
        run: |
          $ad = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          "SURUM=$ad" >> $env:GITHUB_ENV
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Derle
        shell: pwsh
        run: ./paketleme/derle.ps1 -Cikti dist -Surum $env:SURUM -KurulumZorunlu
      - uses: actions/upload-artifact@v7
        with:
          name: tr2en-${{ env.SURUM }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
      - name: Sürüme ekle
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:SURUM *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:SURUM --generate-notes --latest --title "tr2en $env:SURUM (Beta)" }
          gh release upload $env:SURUM (Get-ChildItem dist/*.zip, dist/*.exe, dist/*.sha256).FullName --clobber
      - name: VirusTotal
        # Şimdilik kapalı (20.11): betik var olan raporu okuyamıyor; düzelince `github.ref_type == 'tag'` yap.
        if: false
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./paketleme/virustotal.ps1 -Dosyalar "dist/*-kurulum.exe", "dist/*.zip" -Surum $env:SURUM

name: virustotal

# Elle çalıştırma: yayınlanmış bir sürümün kurulum dosyasını ve zip'ini (yeniden) VirusTotal'a taratır,
# sonucu o sürümün notuna ekler. Normalde exe.yml bunu her v* etiketinde kendisi yapar.
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm etiketi (ör. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  tara:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Sürüm dosyalarını indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.surum }}" --dir dist --pattern "*-kurulum.exe" --pattern "*.zip"
      - name: VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./paketleme/virustotal.ps1 -Dosyalar "dist/*-kurulum.exe", "dist/*.zip" -Surum "${{ inputs.surum }}"

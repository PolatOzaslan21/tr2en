name: virustotal

# Bir sürümün kurulum dosyasını ve zip'ini VirusTotal'a taratır; sonuç yalnızca hepsi temizse sürüm notuna eklenir.
# - Elle: Actions → virustotal → Run workflow (girdi: sürüm etiketi).
# - Saatlik ikinci kontrol: exe.yml'deki tarama ücretsiz kuyrukta 20 dk'da bitmeyebiliyor. Son sürüm 24 saatten
#   yeniyse ve notunda "### VirusTotal" yoksa yeniden bakar (rapor hazırsa ~1 dk). 24 saat sonra o sürüm için durur;
#   tespit varsa not yine boş kalır (Polat'ın kuralı).
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm etiketi (ör. v0.2.1); boş bırakılırsa saatlik kontrol gibi davranır"
        required: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: virustotal
  cancel-in-progress: false

jobs:
  tara:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Hangi sürüm
        id: sec
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIRDI: ${{ inputs.surum }}
        run: |
          if ($env:GIRDI) {
            "surum=$env:GIRDI" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $son = gh release view --json tagName,publishedAt,body | ConvertFrom-Json
          $yas = (Get-Date).ToUniversalTime() - ([datetime]$son.publishedAt).ToUniversalTime()
          if ($yas.TotalHours -gt 24) { Write-Host "Son sürüm $($son.tagName) 24 saatten eski; kontrol yok."; exit 0 }
          if ($son.body -match '(?m)^###\s+VirusTotal') { Write-Host "$($son.tagName) notunda VirusTotal sonucu zaten var."; exit 0 }
          Write-Host "$($son.tagName) için ikinci kontrol."
          "surum=$($son.tagName)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        if: steps.sec.outputs.surum != ''
      - name: Sürüm dosyalarını indir
        if: steps.sec.outputs.surum != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.sec.outputs.surum }}" --dir dist --pattern "*-kurulum.exe" --pattern "*.zip"
      - name: VirusTotal
        if: steps.sec.outputs.surum != ''
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./paketleme/virustotal.ps1 -Dosyalar "dist/*-kurulum.exe", "dist/*.zip" -Surum "${{ steps.sec.outputs.surum }}"
